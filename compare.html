<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Transformation: Before vs After (TECHNOVA 2026)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #1e293b; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .title-group { display: flex; align-items: center; gap: 12px; }
    h1 { font-size: 1.15rem; font-weight: 700; color: #ffffff; }
    .badge { background: #3b82f6; color: #fff; font-size: 0.72rem; padding: 3px 8px; border-radius: 9999px; font-weight: 600; }

    .view-controls { display: flex; gap: 8px; }
    .view-btn { background: #334155; color: #cbd5e1; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
    .view-btn.active, .view-btn:hover { background: #2563eb; color: #fff; }

    .main-frames { display: flex; flex: 1; height: calc(100vh - 60px); position: relative; background: #020617; }
    .frame-wrapper { flex: 1; display: flex; flex-direction: column; height: 100%; border-right: 1px solid #334155; }
    .frame-wrapper:last-child { border-right: none; }
    .frame-header { background: #111827; padding: 8px 16px; font-size: 0.8rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
    .tag-before { color: #f87171; }
    .tag-after { color: #34d399; }
    iframe { flex: 1; width: 100%; height: 100%; border: none; background: #fff; }

    /* Single view toggles */
    .hidden-frame { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Same Page, New Design — Live Comparison</h1>
      <span class="badge">170 Words Identical</span>
    </div>
    <div class="view-controls">
      <button class="view-btn active" id="btnSplit">Side-by-Side</button>
      <button class="view-btn" id="btnBefore">Before (Unstyled)</button>
      <button class="view-btn" id="btnAfter">After (Redesigned)</button>
    </div>
  </header>

  <div class="main-frames">
    <div class="frame-wrapper" id="frameBeforeWrap">
      <div class="frame-header">
        <span>Step 1: Without Skill</span>
        <span class="tag-before">before.html</span>
      </div>
      <iframe src="before.html"></iframe>
    </div>

    <div class="frame-wrapper" id="frameAfterWrap">
      <div class="frame-header">
        <span>Step 3: With Design Skill</span>
        <span class="tag-after">after.html</span>
      </div>
      <iframe src="after.html"></iframe>
    </div>
  </div>

  <script>
    const btnSplit = document.getElementById('btnSplit');
    const btnBefore = document.getElementById('btnBefore');
    const btnAfter = document.getElementById('btnAfter');
    const wrapBefore = document.getElementById('frameBeforeWrap');
    const wrapAfter = document.getElementById('frameAfterWrap');

    function setActive(btn) {
      [btnSplit, btnBefore, btnAfter].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    btnSplit.addEventListener('click', () => {
      setActive(btnSplit);
      wrapBefore.classList.remove('hidden-frame');
      wrapAfter.classList.remove('hidden-frame');
    });

    btnBefore.addEventListener('click', () => {
      setActive(btnBefore);
      wrapBefore.classList.remove('hidden-frame');
      wrapAfter.classList.add('hidden-frame');
    });

    btnAfter.addEventListener('click', () => {
      setActive(btnAfter);
      wrapBefore.classList.add('hidden-frame');
      wrapAfter.classList.remove('hidden-frame');
    });
  </script>
</body>
</html>
